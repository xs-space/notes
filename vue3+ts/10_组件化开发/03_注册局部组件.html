<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app"></div>
    <template id="my-app">
      <component-a></component-a>
    </template>

    <template id="component-a">
      <h2>component-a</h2>
      <p>我是内容</p>
    </template>

    <script src="../js/vue.js"></script>
    <script>
      const ComponentA = {
        template: "#component-a",
      };

      const App = {
        template: "#my-app",
        components: {
          ComponentA, // 局部注册组件
        },
      };
      const app = Vue.createApp(App);
      //   app.component("ComponentA", ComponentA); // 全局注册组件
      app.mount("#app");
    </script>
  </body>
</html>

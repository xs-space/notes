<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app"></div>

    <template id="my-app">
        <input type="text" v-model.trim="message" />
        <h2>{{message}}</h2>
        <h2>{{title}}</h2>
        <p>{{desc}}</p>

        <button @click="btnClick">按钮</button>
    </template>
    
    <script src="../js/vue.js"></script>
    <script>
        const App = {
            template: '#my-app',
            data() {
                return {
                    message: "hello world",
                    title: "this is title",
                    desc: "this is desc"
                }
            },
            methods: {
                btnClick() {
                    console.log("按钮被点击了")
                }
            }   
        }

        Vue.createApp(App).mount('#app')
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app"></div>

    <template id="my-app">
      <button @click="changeInfo">改变info</button>
      <button @click="changeFriendName">改变friend[0].name</button>
    </template>

    <script src="../js/vue.js"></script>
    <script>
      const App = {
        template: "#my-app",
        data() {
          return {
            info: { name: "zhangsan", age: 18 },
            friends: [{ name: "xs" }, { name: "lisi" }],
          };
        },
        watch: {
          "info.name": function (newName, oldName) {
            console.log("newName: ", newName, "oldName", oldName);
          },
          // 无法监听
          "friends[0].name": function (newName, oldName) {
            console.log("newName: ", newName, "oldName", oldName);
          },
        },
        methods: {
          changeInfo() {
            this.info = { name: "lisi", age: 20 };
          },
          changeFriendName() {
            this.friends[0].name = "wangwu";
          },
        },
        created() {
          const unwatch = this.$watch(
            "info",
            function (newInfo, oldInfo) {
              console.log("newInfo: ", newInfo, "oldInfo", oldInfo);
            },
            { deep: true, immediate: true }
          );
          // unwatch() // 取消监听
        },
      };

      Vue.createApp(App).mount("#app");
    </script>
  </body>
</html>

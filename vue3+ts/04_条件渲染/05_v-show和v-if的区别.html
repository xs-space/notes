<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app"></div>

    <template id="my-app">
        <!-- v-show不支持template
             v-show不可以和v-else一起使用
             v-show只是简单的切换元素的display属性
             v-if是条件渲染, 条件不满足时, 元素不会被渲染到页面上
        -->
        <h2 v-show="isShow">哈哈哈</h2>
        <h2 v-if="isShow">呵呵呵</h2>
    </template>
    
    <script src="../js/vue.js"></script>
    <script>
        const App = {
            template: '#my-app',
            data() {
                return {
                    isShow: true
                }
            }
        }

        Vue.createApp(App).mount('#app')
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app"></div>

    <template id="my-app">
        <h2>个人信息</h2>
        <ul>
            <template v-for="(v, k) in info">
                <li>{{ k }}</li>
                <li>{{ v }}</li>
                <li class="divider"></li>
            </template>
        </ul>


    </template>
    
    <script src="../js/vue.js"></script>
    <script>
        const App = {
            template: '#my-app',
            data() {
                return {
                    info: {
                        name: '张三',
                        age: 18,
                        height: 188
                    }
                }
            }
        }

        Vue.createApp(App).mount('#app')
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app"></div>

    <template id="my-app">
        <div :class="className">哈哈哈</div>
        <!-- 对象语法 -->
        <div :class="['abc', title, {'activate': isActivate}]">呵呵呵</div>

    </template>
    
    <script src="../js/vue.js"></script>
    <script>
        const App = {
            template: '#my-app',
            data() {
                return {
                    className: "class",
                    title: "aaa",
                    isActivate: true
                }
            }
        }

        Vue.createApp(App).mount('#app')
    </script>
</body>
</html>

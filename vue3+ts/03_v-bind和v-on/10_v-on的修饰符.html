<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app"></div>

    <template id="my-app">
        <div @click="divClick">
            <button @click="btnClick">按钮</button>
            <button @click.stop="btnClick">按钮</button>
            <input type="text" @keyup.enter="enterKeyup">
        </div>
        <img src="../images/03_10_v-on的修饰符1.png" alt="">
    </template>
    
    <script src="../js/vue.js"></script>
    <script>
        const App = {
            template: '#my-app',
            data() {
                return {
                    message: "hello world"
                }
            },
            methods: {
                divClick() {
                    console.log("div被点击了")
                },
                btnClick() {
                    console.log("button被点击了")
                },
                enterKeyup(event) {
                    console.log("enterKeyup被点击了", event.target.value)
                }
            }
        }


        Vue.createApp(App).mount('#app')
    </script>
</body>
</html>

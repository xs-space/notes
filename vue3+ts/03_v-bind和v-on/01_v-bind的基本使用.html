<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app"></div>

    <template id="my-app">
        <!-- v-bind基本使用 -->
        <img v-bind:src="imgUrl" alt="头像" width="100">
        <a v-bind:href="link">百度一下</a>

        <!-- v-bind语法糖 -->
        <img :src="imgUrl" alt="头像" width="100">
        <a :href="link">百度一下</a>
    </template>
    
    <script src="../js/vue.js"></script>
    <script>
        const App = {
            template: '#my-app',
            data() {
                return {
                    imgUrl: "https://avatars.githubusercontent.com/u/10335230",
                    link: "www.baidu.com",
                }
            }
        }

        Vue.createApp(App).mount('#app')
    </script>
</body>
</html>

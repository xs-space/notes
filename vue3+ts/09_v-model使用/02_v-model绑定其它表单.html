<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app"></div>

    <template id="my-app">
      <!-- 1.绑定textarea -->
      <label for="intro">
        自我介绍：
        <textarea
          name="intro"
          id="intro"
          v-model="intro"
          cols="30"
          rows="10"
        ></textarea>
      </label>
      <h2>intro: {{intro}}</h2>

      <!-- 2.绑定checkbox -->
      <!-- 2.1 单选框 -->
      <label for="agree">
        <input id="agree" type="checkbox" v-model="isAgree" />同意协议
      </label>
      <h2>isAgree: {{isAgree}}</h2>
      <!-- 2.2 多选框 -->
      <span>你的爱好：</span>
      <label for="basketball">
        <input
          id="basketball"
          type="checkbox"
          v-model="hobbies"
          value="basketball"
        />篮球
      </label>
      <label for="football">
        <input
          id="football"
          type="checkbox"
          v-model="hobbies"
          value="football"
        />足球
      </label>
      <label for="tennis">
        <input
          id="tennis"
          type="checkbox"
          v-model="hobbies"
          value="tennis"
        />网球
      </label>
      <h2>hobbies: {{hobbies}}</h2>

      <!-- 3.radio -->
      <span>你的性别：</span>
      <label for="male">
        <input id="male" type="radio" v-model="gender" value="male" />男
      </label>
      <label for="female">
        <input id="female" type="radio" v-model="gender" value="female" />女
      </label>
      <h2>gender: {{gender}}</h2>

      <!-- 4.select -->
      <!-- 4.1 单选 -->
      <span>喜欢的水果：</span>
      <select v-model="fruit">
        <option value="apple">苹果</option>
        <option value="banana">香蕉</option>
        <option value="orange">橘子</option>
      </select>
      <h2>fruit: {{fruit}}</h2>
      <!-- 4.2 多选 -->
      <span>喜欢的水果：</span>
      <select v-model="m_fruit" multiple size="2">
        <option value="apple">苹果</option>
        <option value="banana">香蕉</option>
        <option value="orange">橘子</option>
      </select>
      <h2>m_fruit: {{m_fruit}}</h2>
    </template>

    <script src="../js/vue.js"></script>
    <script>
      const App = {
        template: "#my-app",
        data() {
          return {
            intro: "hello world",
            isAgree: false,
            hobbies: ["football"],
            gender: "female",
            fruit: "banana",
            m_fruit: "banana",
          };
        },
      };

      Vue.createApp(App).mount("#app");
    </script>
  </body>
</html>
